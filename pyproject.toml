[project]
name = "s2-adhesion"
version = "0.1.0"
description = "3D instance-based quantification of S2 cell adhesion from nd2 confocal stacks"
requires-python = ">=3.12"

# Core measurement dependencies. Deliberately free of torch/cellpose: the metrics
# layer must run on a machine with no ML stack installed, measuring label volumes
# produced elsewhere.
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "scikit-image>=0.25",
    "pandas>=2.2",
    "zarr>=3.0",
    "tifffile>=2025.1.10",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# ND2 reading. Light, no ML.
nd2 = ["nd2>=0.10"]
# Cellpose 3 (cyto3, U-Net). The local default -- see docs/cellpose_cpu_notes.md.
cellpose3 = ["cellpose>=3,<4", "torch>=2.0"]
# Cellpose 4 (cpsam, SAM/transformer). GPU only in practice.
cellpose4 = ["cellpose>=4,<5", "torch>=2.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
s2-adhesion = "s2_adhesion.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/s2_adhesion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running tests, excluded from the default run",
    "needs_ml: requires cellpose/torch installed",
]
addopts = "-m 'not slow and not needs_ml'"
